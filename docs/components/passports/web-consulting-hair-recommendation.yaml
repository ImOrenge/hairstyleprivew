id: web.consulting.hair-recommendation
name: HairRecommendationWorkbench
platform: web
kind: feature
status: experimental
source: my-app/components/consulting/hair/HairRecommendationWorkbench.tsx
related_source:
  - my-app/hooks/useHairRecommendation.ts
  - my-app/lib/consulting/hair-recommendation-view.ts
  - my-app/lib/consulting/hair-recommendation-server.ts
owner: consulting-feature

public_api:
  props:
    - snapshot
    - mutate
    - saving
    - pollingEnabled
  events:
    - automatic-nine-preview-start
    - clarification-answer
    - customer-final-confirm
    - adjustment-request
    - downstream-handoff

boundaries:
  owns:
    - nine-slot-progress-and-recovery-presentation
    - ai-top-three-guidance
    - all-nine-generated-output-gallery
    - all-nine-customer-selection
    - single-final-confirmation
    - adjustment-capture
    - isolated-clarification-surface
    - isolated-adjustment-revision-surface
  forbidden:
    - customer-required-shortlist
    - client-authored-rank-or-score
    - final-confirm-before-nine-accepted
    - common-next-control
    - simultaneous-edit-form-and-result-gallery

styling:
  strategy: existing-tailwind-utilities-with-global-app-tokens
  global_css_changes: false
  namespace: data-hair-recommendation-workbench
  tokens:
    - app-border
    - app-border-strong
    - app-surface
    - app-surface-muted
    - app-muted
    - app-inverse
    - app-inverse-text
  inline_styles_allowed: false

state:
  server_owned:
    - preview-board-and-nine-slot-attempts
    - recommendation-decision-and-revision
    - primary-preview-id
    - confirmed-preview-id-rank-and-selection-source
    - pending-adjustment
  local:
    - selected-adjustment-aspect
    - selected-final-preview-id-before-confirmation
    - unsaved-adjustment-text
    - action-in-flight
  polling: server-snapshot-only

a11y_contract:
  progress: native-progress-with-text-equivalent-and-polite-live-region
  gallery: all-nine-images-have-slot-ai-rank-and-selected-labels
  controls: native-single-select-radio-group-and-buttons-with-disabled-state
  errors: role-alert
  keyboard: DOM-order-current-selection-before-all-nine-radio-gallery

test_surface:
  unit: hair-recommendation-view-and-policy
  contract: phase-49-hair-primary-ux-contract
  interaction: clarification-confirm-adjust-and-resume
  visual: 390-768-desktop-all-nine-overflow

change_policy:
  current_gate: behavioral-compatible
  compatible_change_requires:
    - passport-update
    - web-typecheck
    - component-registry-validation
  behavioral_change_requires:
    - interaction-test
    - flag-on-off-regression

promotion_blockers:
  - authenticated-nine-image-provider-smoke-not-run
  - device-accessibility-audit-not-run
