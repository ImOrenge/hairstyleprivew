id: web.consulting.scene
name: ConsultationScene
platform: web
kind: layout
status: candidate
source: my-app/components/consulting/scene/ConsultationScene.tsx
related_source:
  - my-app/components/consulting/ConsultationStagePage.tsx
  - my-app/components/consulting/scene/SceneIdentity.tsx
  - my-app/components/consulting/scene/FloatingStageControls.tsx
  - my-app/components/consulting/scene/StageMapOverlay.tsx
  - my-app/components/consulting/workbenches/shared.tsx
  - my-app/components/consulting/photo/ConsultationPhotoEvidence.tsx
  - my-app/components/consulting/photo/FaceEvidenceOverlay.tsx
  - my-app/components/consulting/transition/ConsultationTransitionScreen.tsx
  - my-app/components/consulting/workbenches/BriefWorkbench.tsx
  - my-app/components/consulting/workbenches/AftercareWorkbench.tsx
owner: consulting-feature

public_api:
  exports:
    - ConsultationScene
  props:
    - snapshot
    - stage
    - notice
    - onRefresh
  events:
    - open-stage-map
    - open-recommended-task
    - server-snapshot-refresh
    - request-consultation-exit
    - confirm-consultation-exit-to-home

boundaries:
  feature:
    owns:
      - headerless-scene-layout
      - scene-identity
      - floating-navigation
      - stage-map-overlay
      - persisted-analysis-evidence-overlay
      - semantic-user-input-and-ai-output-panes
      - desktop-independent-pane-scrolling
      - stage-specific-ai-and-system-data-rail
      - compact-desktop-scene-identity
      - lifecycle-capability-navigation
      - durable-analysis-task-status
      - fashion-batch-status
      - automatic-salon-brief-hydration
      - actual-service-triggered-aftercare-generation
      - rich-aftercare-ai-output
      - designer-feedback-separate-brief-revision
      - fashion-shortlist-comparison-matrix
      - hairstyle-blueprint-user-profile-handoff
      - face-aware-four-by-five-photo-crop
      - optional-private-natural-light-color-assist
      - persisted-facial-proportion-matrix
      - persisted-gender-aware-korean-salon-face-shape-blend-chart
      - analysis-photo-in-left-source-pane
      - transient-liveness-screen-host
      - consultation-exit-confirmation
  forbidden:
    - generation-domain-workflow
    - backend-refactor-package-contracts
    - global-css-token-mutation

styling:
  strategy: existing-tailwind-utilities-with-global-app-tokens
  global_css_changes: true
  global_css:
    file: my-app/app/globals.css
    namespace: f-consulting-input-control
  tokens:
    - app-border
  runtime_inline_styles:
    - normalized-photo-crop-preview-position-and-size
    - persisted-face-shape-conic-gradient-and-legend-swatches
  input_control_separator: one-pixel-tokenized-bottom-rule-except-last-sibling

state:
  server_owned:
    - consultation-snapshot
    - analysis-evidence-v2
    - analysis-evidence-correction-revision
    - append-only-manual-coordinate-corrections
    - version
    - lifecycle-state
    - recommended-stage
    - allowed-stages
    - completed-stages
    - active-tasks
    - blocking-actions
  client_owned:
    - stage-map-open
    - form-drafts
    - active-evidence-id
    - visible-evidence-layers
    - selected-landmark-id
    - independent-pane-scroll-position
    - consultation-exit-dialog-open

a11y_contract:
  stage_map: dialog-with-escape-and-focus-return
  navigation: labelled-native-links-and-buttons-without-common-next-control
  exit: confirmation-dialog-with-escape-focus-return-and-saved-state-disclosure
  scene_entry: programmatic-focus-on-level-one-heading
  reduced_motion: no-required-motion
  split_canvas: labelled-regions-input-first-in-dom-mobile-stacked
  split_canvas_scroll: input-and-output-scroll-regions-keyboard-focusable-with-visible-focus-ring
  photo_crop: labelled-native-range-controls-and-explicit-framing-confirmation
  analysis_matrix: native-meter-values-with-text-equivalents-and-non-physical-unit-disclosure
  face_shape_blend: chart-has-text-percentage-equivalent-and-non-medical-disclosure

test_surface:
  structure: my-app/lib/consulting/consultation-contract.test.ts
  interaction: required
  visual: required
  hairstyle_blueprint: discovery-hair-inputs-normalized-before-generation-acceptance
  evidence_overlay: persisted-normalized-coordinates-only
  evidence_correction: server-revision-locked-user-adjustment-with-model-original-preserved
  evidence_linkage: photo-overlay-ledger-direction-matrix-share-active-evidence-id
  split_canvas: all-11-scenes-desktop-independent-scroll-and-mobile-stacking
  split_canvas_scroll: all-11-scenes-serious-critical-axe-zero
  input_control_separator: shared-choice-and-text-controls-use-visible-tokenized-boundaries
  salon_brief: entry-auto-generation-without-user-save-click
  aftercare: actual-service-first-then-generated-care-editing
  brief_feedback: separate-revision-without-selected-style-mutation
  fashion_compare: two-to-three-shortlist-common-axis-matrix
  photo_crop: shared-four-by-five-transform-unit-and-browser-interaction
  photo_color_assist: separate-private-draft-used-only-for-personal-color-when-valid
  analysis_matrix: persisted-measurements-only-without-client-inference-or-centimeter-claims
  face_shape_blend: server-derived-landmark-ratio-percentages-use-onboarding-male-female-reference-and-sum-to-one-hundred

change_policy:
  current_gate: consultation-frontend-and-lifecycle-feature-flags
  compatible_change_requires:
    - passport-update
    - consulting-contract-test
    - web-typecheck
  behavioral_change_requires:
    - 11-stage-browser-regression

promotion_blockers:
  - remote-lifecycle-migration-not-applied
  - authenticated-entitlement-backed-fashion-batch-smoke-requires-explicit-approval
