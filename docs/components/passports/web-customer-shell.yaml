id: web.customer.shell
name: CustomerShell family
platform: web
kind: layout
status: experimental
source: my-app/components/customer/CustomerShell.tsx
related_source:
  - my-app/components/customer/customer-shell.css
  - my-app/components/customer/CustomerHomeExperience.tsx
  - my-app/components/layout/Footer.tsx
  - my-app/lib/customer-navigation.ts
  - my-app/lib/customer-home-v2-server.ts
  - my-app/lib/customer-home-view.ts
  - my-app/lib/v2/customer-history-server.ts
  - my-app/components/customer/CustomerStylebookCollection.tsx
  - my-app/app/result/v2/[selectionId]/page.tsx
owner: customer-experience

public_api:
  exports:
    - CustomerShell
    - CustomerPageHeader
    - CustomerHomeExperience
  props:
    - children: ReactNode
    - activePath: optional test-harness route override
    - page-header-copy-and-action
  events:
    - native-link-navigation
    - home-action-selection
    - home-action-keyboard-navigation

boundaries:
  owns:
    - customer-only-responsive-navigation
    - HairFit-editorial-hybrid-visual-tokens
    - desktop-fixed-rail
    - tablet-compact-rail
    - mobile-safe-area-bottom-navigation
    - customer-aligned-legal-business-footer
    - HairFit-logo-brand-mark
    - V2-confirmed-style-history-presentation
    - V2-final-fashion-look-history-presentation
    - V2-actual-service-aftercare-presentation
    - confirmed-result-only-home-hero-media
    - state-aware-home-action-deck
  forbidden:
    - consultation-stage-rendering
    - consultation-route-or-data-mutation
    - salon-or-admin-navigation
    - account-fetching
    - customer-credit-balance-copy
    - legacy-generation-stylebook-aggregation
    - legacy-user-hair-record-aftercare

route_contract:
  shell_routes:
    - /home
    - /stylebook
    - /aftercare
    - /mypage
  primary_consultation_entry: /consulting/new
  consultation_shell: hidden
  global_header: hidden
  global_footer: visible-and-customer-aligned
  brand_icon: /logo.png
  internal_consultation_flow: preserved
  nested_customer_routes: supported
  compatibility_redirect: /result/v2/{selectionId} -> /consulting/{consultationId}/result

history_data_contract:
  home_sources:
    - consultation_sessions-v2-active-and-completed
    - actual_services_v2-latest-confirmed
  home_destinations:
    - /consulting/{consultationId}/{recommendedStage}
    - /consulting/{consultationId}/result
    - /aftercare/{actualServiceId}
  home_legacy_generation_dependency: forbidden
  home_hero_media: completed-consultation-image-only
  home_without_confirmed_media: recommendation-panel-with-no-image-dom
  home_default_priority:
    - in-progress-consultation
    - completed-result
    - new-consultation
  stylebook_sources:
    - style_selection_snapshots_v2-confirmed-only
    - fashion_preview_sets_v2-latest-final-selection
    - styling_sessions-v2-selection-completed-media
  stylebook_destinations:
    - /consulting/{consultationId}/result
    - /consulting/{consultationId}/result?tab=fashion
  stylebook_result_surface: existing-consultation-final-result-stage
  legacy_generation_dependency: forbidden
  aftercare_sources:
    - actual_services_v2
    - aftercare_programs_v2
    - aftercare_checkins_v2
  preview_media: signed-styling-results-path-from-selection-snapshot
  read_behavior: server-only-no-mutating-ensure-call

styling:
  strategy: HairFit-editorial-hybrid-customer-scoped-global-css
  stylesheet: my-app/components/customer/customer-shell.css
  root_namespace: customer-app
  tokens:
    canvas: '#F6F5F1'
    surface: '#FFFFFF'
    raised: '#ECEAE3'
    graphite: '#151412'
    ivory: '#F4F1E8'
    ink: '#191816'
    muted: '#625F57'
    champagne: '#A8863A'
  inverse_surface_scope:
    - desktop-rail
    - consultation-hero
    - mobile-bottom-navigation
  global_css_changes: import-only
  inline_styles_allowed: false

a11y_contract:
  navigation_label: 고객 주요 내비게이션
  active_item: aria-current-page
  focus_indicator: visible-champagne-outline
  reduced_motion: supported
  action_state: aria-pressed
  action_keyboard: arrow-keys-home-end

test_surface:
  structure: my-app/lib/app-shell-accessibility.test.ts
  web_typecheck: required
  interaction: required
  responsive_visual: required
  no-confirmed-image-dom: required
  single-footer: required
  customer_copy: credit-balance-excluded

change_policy:
  current_gate: behavioral-and-style-contract
  compatible_change_requires:
    - passport-update
    - shell-contract-test
    - web-typecheck
    - V2-history-source-contract-test
  breaking_change_requires:
    - all-customer-route-consumer-update
    - consultation-boundary-audit

promotion_blockers:
  - no-mobile-safe-area-device-evidence
