id: native.consulting.screen
name: MobileConsultingScreen
platform: native
kind: feature
status: experimental
source: apps/hairfit-app/app/consulting.tsx
related_source:
  - apps/hairfit-app/components/consulting/NativeFaceEvidenceOverlay.tsx
  - apps/hairfit-app/components/consulting/NativePersonalColorProfileV2.tsx
  - apps/hairfit-app/components/consulting/NativeMakeupDirectionV1.tsx
  - apps/hairfit-app/lib/v2-consultation-resume.ts
  - packages/api-client/src/index.ts
  - packages/shared/src/consulting/contract.ts
owner: consulting-feature

public_api:
  route: /consulting
  optional_route_query:
    - consultationId: owned-existing-consultation-to-open
  inputs:
    - authenticated-user
    - active-consultation-id-from-secure-store
    - optional-owned-consultation-id-from-stylebook
    - optional-separate-stylebook-reference-context
    - shared-ConsultationSnapshot
  outputs:
    - zero-required-answer-photo-first-intake
    - optional-single-opening-intent
    - adaptive-hair-trait-observations-and-questions
    - photo-analysis-entry
    - native-landmark-evidence
    - ai-primary-hair-recommendation-and-all-nine-generated-results
    - legacy-hair-preview-comparison-and-decision-when-flag-off
    - automatic-salon-brief
    - personal-color-v2-and-independent-training-consent
    - makeup-direction-routine-and-artist-brief
    - makeup-simulation-state-and-preview
    - fashion-interview-and-adaptive-three-six-nine-batch
    - all-requested-fashion-generated-results-and-runtime-states
    - ai-recommended-fashion-primary-with-customer-override
    - post-fashion-result-synthesis
    - report-v3-provenance-and-all-hair-fashion-generated-results
    - actual-service-aftercare
    - stylebook-reference-display-with-full-existing-flow-preserved

boundaries:
  authoritative_state: server-consultation-snapshot
  projections:
    - v2-analysis-evidence
    - v2-preview-board
    - v2-selection
    - hair-recommendation-decision-and-revision
    - v2-output-tables
    - consultation-report-view-model-v2-with-provenance-v3
  local_state:
    - unsaved-current-control-value
    - fashion-customer-override-before-save
    - selected-landmark
    - unsaved-hair-adjustment
  forbidden:
    - wizard-current-step
    - common-next-control
    - client-authoritative-lifecycle
    - paid-generation-confirmation
    - raw-photo-or-provider-payload-logging
    - stylebook-reference-driven-stage-question-or-order-mutation

styling:
  strategy: ui-native-primitives-and-local-StyleSheet
  stylesheet: apps/hairfit-app/app/consulting.tsx#styles
  tokens:
    - ui-native-Panel
    - ui-native-Card
    - ui-native-Button
    - ui-native-Chip
  css_contract_change: none

state:
  server_owned:
    - ConsultationSnapshot.version
    - ConsultationSnapshot.startContext
    - journey.recommendedStage
    - lifecycle-state
    - capability-results
    - actual-service
    - fashion-batch
    - fashion-requested-count-expansion-revision-and-recommended-preview
    - hair-profile-revision
    - makeup-simulation-selection
    - report-provenance-fingerprint-and-generated-result-counts
  durable_resume: SecureStore-holds-only-consultation-id
  concurrency: optimistic-version-and-idempotency-key

a11y_contract:
  controls: native-buttons-and-labelled-text-inputs
  selection: accessibilityState-selected
  disabled: accessibilityState-disabled
  dynamic_errors: assertive-live-region-alert
  images: accessibility-label-required
  screen_reader_order: input-before-generated-output
  canonical_closing_order: fashion-result-aftercare

test_surface:
  contract: apps/hairfit-app/__tests__/mobile-v2-consultation.test.js
  full_jest: npm --workspace @hairfit/app run test
  typecheck: npm --workspace @hairfit/app run typecheck
  lint: targeted-app-consulting-eslint
  bundle: npm run mobile:bundle

change_policy:
  current_gate: behavioral-compatible
  compatible_change_requires:
    - native-typecheck
    - mobile-v2-consultation-contract
    - phase-43-45-contract-test
    - p54-zero-input-intake-contract-test
    - web-android-ios-bundle
    - component-registry-validation
  promotion_blockers:
    - authenticated-device-smoke-not-run
    - offline-conflict-interaction-test-not-run
    - visual-accessibility-device-audit-not-run
